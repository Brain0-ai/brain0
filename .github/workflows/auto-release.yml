name: auto-release

# Every pull request merged into main ships as a new release: its merge commit is tagged vX.Y.Z,
# then release.yml builds the binaries, publishes to npm and creates the GitHub Release.
#
# Version (scripts/release-version.mjs `next`): the latest v* tag bumped by the PR's label —
# `release:major`, `release:minor`, otherwise patch; `release:skip` merges without releasing.
# A version raised by hand in the manifests by the PR is used when it is higher.
#
# Why a tag and not a "bump version" commit: main's ruleset requires a reviewed pull request,
# so a workflow cannot push to it. The tag carries the version and release.yml stamps it into
# its own checkout. The tag is pushed with GITHUB_TOKEN, which by design does NOT trigger
# release.yml's `push: tags` — release.yml is called below instead. (Pushing the tag with a
# personal token would start a second, concurrent release.)
#
# Manual run: Actions → auto-release → Run workflow releases the current main.

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      level:
        description: "Version bump"
        type: choice
        options: [patch, minor, major]
        default: patch

# One release at a time, in merge order, so npm's `latest` always moves forward. A merge that
# lands while a release is running waits; if several pile up, only the newest waits and it
# releases the newest main, which contains the others. Runs that release nothing (a PR closed
# unmerged, `release:skip`) get a group of their own, so they never cancel a waiting release.
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' ||
         (github.event.pull_request.merged == true &&
          !contains(github.event.pull_request.labels.*.name, 'release:skip')))
        && 'auto-release' || format('auto-release-noop-{0}', github.run_id) }}
  cancel-in-progress: false

permissions: {}

jobs:
  tag:
    name: Tag the merge commit
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.pull_request.merged == true &&
       !contains(github.event.pull_request.labels.*.name, 'release:skip'))
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the tag
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      # pull_request_target runs with a write token: check out the MERGE commit (already on
      # main, reviewed), never the pull request's head.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0   # every tag, to find the latest release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Next version
        id: next
        env:
          LEVEL: >-
            ${{ contains(github.event.pull_request.labels.*.name, 'release:major') && 'major'
             || contains(github.event.pull_request.labels.*.name, 'release:minor') && 'minor'
             || inputs.level || 'patch' }}
        run: |
          set -eu
          # Already released (a re-run, or a tag pushed by hand): release that tag again.
          EXISTING=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -1)
          if [ -n "$EXISTING" ]; then
            echo "HEAD is already tagged $EXISTING"
            echo "tag=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(node scripts/release-version.mjs next "$LEVEL")
          echo "bump: $LEVEL → v$VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "new=true" >> "$GITHUB_OUTPUT"
      - name: Push the tag
        if: steps.next.outputs.new == 'true'
        env:
          TAG: ${{ steps.next.outputs.tag }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "brain0 $TAG${PR:+ (#$PR)}"
          git push origin "refs/tags/$TAG"

  release:
    name: Release
    needs: tag
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
    permissions:
      contents: write   # GitHub Release
      id-token: write   # npm provenance
